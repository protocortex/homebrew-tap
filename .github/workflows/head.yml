name: head

# Builds liam's main branch from source with cargo, `--features local,llama`.
# llama.cpp compiles through CMake, so this takes about 13 minutes. It runs
# when a pull request changes the formula, every week, after a push to main
# that changes the formula, and by hand. A release pull request from the
# release workflow skips it, because bump-formula.sh changes only the stable url
# and sha256 and fails when the head block would differ, so such a pull request
# cannot change what a HEAD build does.
on:
  push:
    branches: [main]
    paths:
      - Formula/**
      - .github/workflows/head.yml
  pull_request:
    paths:
      - Formula/**
      - .github/workflows/head.yml
  schedule:
    - cron: "43 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: head-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  head:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/v') }}
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@c262868c096d909fc278daa87ed9772967331ea3 # 2026.11.02.1

      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Link the checkout as the tap
        run: |
          tap_dir="$(brew --repository)/Library/Taps/protocortex"
          mkdir -p "$tap_dir"
          rm -rf "$tap_dir/homebrew-tap"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir/homebrew-tap"

      - name: Trust this tap
        run: brew trust --tap protocortex/tap

      - name: Install from HEAD
        run: brew install --HEAD --build-from-source --verbose protocortex/tap/liam

      - name: Test
        run: brew test protocortex/tap/liam
