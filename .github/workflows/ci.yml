name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  # brew audit --online reads the GitHub API.
  HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}

jobs:
  # Style and the strict online audit, plus test-bot's own tap syntax checks.
  syntax:
    runs-on: macos-14
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@55301c8cac0982bc2fbeb71275fa0b71b963bdb1 # main
      - name: brew style
        run: brew style protocortex/tap
      - name: brew audit
        run: brew audit --strict --online protocortex/tap/liam
      - name: brew test-bot --only-tap-syntax
        run: brew test-bot --only-tap-syntax

  # The stable url is the prebuilt release archive, so this job is quick.
  stable:
    runs-on: macos-14
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@55301c8cac0982bc2fbeb71275fa0b71b963bdb1 # main
      - name: Install
        run: brew install --verbose protocortex/tap/liam
      - name: Test
        run: brew test protocortex/tap/liam

  # Builds liam's main branch from source with cargo, `--features local,llama`.
  # llama.cpp compiles through CMake, so this is the slow job.
  head:
    runs-on: macos-14
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@55301c8cac0982bc2fbeb71275fa0b71b963bdb1 # main
      - name: Install from HEAD
        run: brew install --HEAD --build-from-source --verbose protocortex/tap/liam
      - name: Test
        run: brew test protocortex/tap/liam
