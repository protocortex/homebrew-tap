# Moves the stable url and sha256 to a new liam release by opening a PR.
#
# Triggers:
#   repository_dispatch (liam-release)  sent by liam's homebrew-bump workflow
#                                       after its Release workflow succeeds
#   schedule                            daily fallback if a dispatch was missed
#   workflow_dispatch                   manual run, optional tag input
#
# Needs the repository secret TAP_BUMP_TOKEN, see the README. It is a token
# rather than GITHUB_TOKEN so the PR it opens starts the CI workflow, which
# pull requests from GITHUB_TOKEN do not.
name: Bump

on:
  repository_dispatch:
    types: [liam-release]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "liam tag to bump to, for example v0.1.2. Empty means the latest release."
        required: false
        type: string

permissions: {}

concurrency:
  group: bump
  cancel-in-progress: false

env:
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  bump:
    runs-on: macos-14
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@55301c8cac0982bc2fbeb71275fa0b71b963bdb1 # main

      - name: Resolve the release asset
        id: asset
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${DISPATCH_TAG:-${INPUT_TAG:-}}"
          if [ -z "$tag" ]; then
            tag="$(gh api repos/protocortex/liam/releases/latest --jq .tag_name)"
          fi
          # The tag ends up in a url and a branch name, so accept only a release tag.
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "refusing tag: $tag" >&2
            exit 1
          fi
          base="https://github.com/protocortex/liam/releases/download/${tag}"
          name="liam-${tag}-aarch64-apple-darwin-netinstall.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name" "${base}/${name}"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name.sha256" "${base}/${name}.sha256"
          published="$(cut -d' ' -f1 < "$RUNNER_TEMP/$name.sha256")"
          actual="$(shasum -a 256 "$RUNNER_TEMP/$name" | cut -d' ' -f1)"
          if ! printf '%s' "$actual" | grep -Eq '^[0-9a-f]{64}$' || [ "$published" != "$actual" ]; then
            echo "sha256 mismatch: published $published, downloaded $actual" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "url=${base}/${name}"
            echo "sha256=$actual"
          } >> "$GITHUB_OUTPUT"

      - name: Open the bump PR
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.TAP_BUMP_TOKEN }}
          ASSET_URL: ${{ steps.asset.outputs.url }}
          ASSET_SHA256: ${{ steps.asset.outputs.sha256 }}
        run: |
          set -euo pipefail
          if [ -z "$HOMEBREW_GITHUB_API_TOKEN" ]; then
            echo "secret TAP_BUMP_TOKEN is not set; see the README" >&2
            exit 1
          fi
          formula="$(brew --repository protocortex/tap)/Formula/liam.rb"
          if grep -q "$ASSET_SHA256" "$formula"; then
            echo "formula already at this release"
            exit 0
          fi
          brew bump-formula-pr --no-browse --no-fork \
            --url "$ASSET_URL" --sha256 "$ASSET_SHA256" \
            protocortex/tap/liam
